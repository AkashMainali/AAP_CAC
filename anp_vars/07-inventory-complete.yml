---
controller_projects:
  - name: "AAP CaC - NetOps"
    organization: "Default"
    description: "Ansible Automation Platform Configuration-as-Code repository — NetOps team"
    scm_type: git
    scm_url: "https://github.com/AkashMainali/AAP_CAC.git"
    scm_branch: "main"
    scm_clean: true
    scm_delete_on_update: false
    scm_track_submodules: false
    scm_update_on_launch: false
    allow_override: false

controller_inventories:
  - name: "NetOps Linux Inventory"
    organization: "Default"
    description: >-
      NetOps Linux managed nodes — sourced from netops-linux-hosts.yml in Git.
      Covers iperf, EVE-NG, Tower, GitLab, Splunk stack, Zoom provisioning nodes
      across US, EMEA, and APAC regions.
    variables: {}

  - name: "NetOps Production Inventory"
    organization: "Default"

  - name: "NetOps Staging Inventory"
    organization: "Default"
    description: "IOS office switches — staging. Sourced from netops-staging-hosts.yml in Git."
    variables:
      ansible_network_os: ios
      ansible_connection: network_cli
      ansible_become: true
      ansible_become_method: enable

  - name: "Proving Ground Inventory"
    organization: "Default"
    description: >-
      Network proving ground / lab environment — IOS switches, IOS routers,
      and NX-OS Nexus cores. Sourced from provinggound-hosts.yml in Git.
      Note: source filename has a typo (provinggound) — this is intentional
      to match the actual filename in the repository.

controller_inventory_sources:
  - name: "NetOps Linux Inventory Source"
    inventory: "NetOps Linux Inventory"
    description: >-
      Syncs hosts and groups from netops-linux-hosts.yml in the AAP CaC repo.
      Groups: by_function (iperf/eveng/tower/gitlab/general/splunk/zoomprov),
      by_region (US/EMEA/APAC sub-regions), py3_hosts.
    source: scm
    source_project: "AAP CaC - NetOps"
    source_path: "playbooks/anp_inventory/netops-linux-hosts.yml"
    update_on_launch: true        # re-sync from Git before every job run
    update_cache_timeout: 0       # 0 = always re-sync; increase (seconds) to throttle
    overwrite: true
    overwrite_vars: true
    verbosity: 1

  - name: "NetOps Production Inventory Source"
    inventory: "NetOps Production Inventory"
    description: >-
      Syncs hosts and groups from netops-production-hosts.yml in the AAP CaC repo.
      Covers IOS core/distro switches, IOS routers (WAN/CPE/cEdge),
      and NX-OS Nexus core switches with HSRP role host vars.
    source: scm
    source_project: "AAP CaC - NetOps"
    source_path: "playbooks/anp_inventory/netops-production-hosts.yml"
    update_on_launch: true
    update_cache_timeout: 0
    overwrite: true
    overwrite_vars: true
    verbosity: 1

  - name: "NetOps Staging Inventory Source"
    inventory: "NetOps Staging Inventory"
    description: "Syncs hosts and groups from netops-staging-hosts.yml in the AAP CaC repo"
    source: scm
    source_project: "AAP CaC - NetOps"
    source_path: "playbooks/anp_inventory/netops-staging-hosts.yml"
    update_on_launch: true
    update_cache_timeout: 0
    overwrite: true
    overwrite_vars: true
    verbosity: 1

  - name: "Proving Ground Inventory Source"
    inventory: "Proving Ground Inventory"
    description: >-
      Syncs hosts and groups from provinggound-hosts.yml in the AAP CaC repo.
      Covers IOS core/distro switches, IOS routers (WAN/CPE/cEdge),
      and NX-OS Nexus core switches with HSRP role host vars.
    source: scm
    source_project: "AAP CaC - NetOps"
    source_path: "playbooks/anp_inventory/provinggound-hosts.yml"
    update_on_launch: true
    update_cache_timeout: 0
    overwrite: true
    overwrite_vars: true
    verbosity: 1