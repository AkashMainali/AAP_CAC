---
controller_credentials:
  # --- RHEL Organization Credentials ---
  - name: "RHEL-GIT Creds"
    organization: "RHEL"
    credential_type: "Source Control"
    inputs:
      username: "{{ rhel_git_uname }}"
      password: "{{ rhel_git_pass }}"

  - name: "RHEL-Machine Creds"
    organization: "RHEL"
    credential_type: "Machine"
    inputs:
      username: "{{ rhel_machine_uname }}"
      password: "{{ rhel_machine_pass }}"

  # --- Windows Organization Credentials ---
  - name: "Windows-GIT Creds"
    organization: "Windows"
    credential_type: "Source Control"
    inputs:
      username: "{{ windows_machine_uname }}"
      password: "{{ windows_git_pass }}"

  - name: "Windows-Machine Creds"
    organization: "Windows"
    credential_type: "Machine"
    inputs:
      username: "{{ windows_git_uname }}"
      password: "{{ windows_machine_pass }}"

controller_roles:
  # --- RHEL RBAC for Credentials ---
  - team: "RHEL-admin"
    credential: "RHEL-Machine Creds"
    role: "admin"
  - team: "RHEL-admin"
    credential: "RHEL-GIT Creds"
    role: "admin"
  - team: "RHEL-Operator"
    credential: "RHEL-Machine Creds"
    role: "use"

  # --- Windows RBAC for Credentials ---
  - team: "Windows-Admin"
    credential: "Windows-Machine Creds"
    role: "admin"
  - team: "Windows-Admin"
    credential: "Windows-GIT Creds"
    role: "admin"
  - team: "Windows-Operator"
    credential: "Windows-Machine Creds"
    role: "use"

##### Arnold and Porter #######

controllers_credentials:
  # --- Ansible Galaxy ---
  - name: "Ansible Galaxy"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      username: "{{ ansible_galaxy_uname }}"
      password: "{{ ansible_galaxy_pass }}"

  # --- Machine Credentials ---
  - name: "ansible worker"
    credential_type: "Machine"
    inputs:
      username: "{{ ansible_worker_uname }}"
      password: "{{ ansible_worker_pass }}"

  - name: "ansible worker linux"
    organization: "ArnoldPorter"
    credential_type: "Machine"
    inputs:
      username: "{{ ansible_worker_linux_uname }}"
      password: "{{ ansible_worker_linux_pass }}"

  - name: "Demo Credential"
    organization: "admin"
    credential_type: "Machine"
    inputs:
      username: "{{ demo_credential_uname }}"
      password: "{{ demo_credential_pass }}"

  - name: "Linux Admin ansible (new)"
    organization: "ArnoldPorter"
    credential_type: "Machine"
    inputs:
      username: "{{ linux_admin_ansible_uname }}"
      password: "{{ linux_admin_ansible_pass }}"

  - name: "console"
    organization: "Netsos"
    credential_type: "Machine"
    inputs:
      username: "{{ console_uname }}"
      password: "{{ console_pass }}"

  - name: "console_prompt"
    organization: "Netsos"
    credential_type: "Machine"
    inputs:
      username: "{{ console_prompt_uname }}"
      password: "{{ console_prompt_pass }}"

  - name: "setup"
    organization: "Netsos"
    credential_type: "Machine"
    inputs:
      username: "{{ setup_uname }}"
      password: "{{ setup_pass }}"

  # --- Vault Credentials ---
  - name: "ansible_worker_vault"
    organization: "ArnoldPorter"
    credential_type: "Vault"
    inputs:
      vault_password: "{{ ansible_worker_vault_pass }}"

  - name: "Linux Admin Vault"
    organization: "ArnoldPorter"
    credential_type: "Vault"
    inputs:
      vault_password: "{{ linux_admin_vault_pass }}"

  # --- Network Credentials ---
  - name: "avanlife"
    organization: "ArnoldPorter"
    credential_type: "Network"
    inputs:
      username: "{{ avanlife_uname }}"
      password: "{{ avanlife_pass }}"

  # --- Cisco Local User Password ---
  - name: "brokerdess"
    organization: "DA11438_e, ArnoldPorter"
    credential_type: "Cisco Local User Password"
    inputs:
      username: "{{ brokerdess_uname }}"
      password: "{{ brokerdess_pass }}"

  # --- Source Control Credentials ---
  - name: "us7github01"
    organization: "Netsos"
    credential_type: "Source Control"
    inputs:
      username: "{{ us7github01_uname }}"
      password: "{{ us7github01_pass }}"