---
# Converted from static inventory to AAP 2.6 Configuration-as-Code
# infra.aap_configuration compatible var file
# Source: all-in-one YAML inventory (original comment by Olly, 2022-02-22)

controller_inventories:
  - name: "Network Automation Inventory"
    organization: "Default"
    description: "Master inventory covering all regions and functions - converted from static YAML inventory"

# ---------------------------------------------------------------------------
# GROUPS
# Top-level smart groups map to the original `children` hierarchy.
# AAP inventory groups are created via controller_groups.
# ---------------------------------------------------------------------------
controller_groups:

  # ── by_function ────────────────────────────────────────────────────────────
  - name: by_function
    inventory: "Network Automation Inventory"
    description: "Hosts grouped by their functional role"

  - name: iperf
    inventory: "Network Automation Inventory"
    description: "iPerf testing nodes"
    parents:
      - by_function

  - name: thousand_eyes
    inventory: "Network Automation Inventory"
    description: "ThousandEyes agent nodes"
    parents:
      - by_function

  - name: eveng
    inventory: "Network Automation Inventory"
    description: "EVE-NG lab nodes"
    parents:
      - by_function

  - name: tower
    inventory: "Network Automation Inventory"
    description: "Ansible Tower / AAP nodes"
    parents:
      - by_function

  - name: gitlab
    inventory: "Network Automation Inventory"
    description: "GitLab nodes"
    parents:
      - by_function

  - name: chronicle
    inventory: "Network Automation Inventory"
    description: "Google Chronicle SIEM nodes"
    parents:
      - by_function

  - name: docker
    inventory: "Network Automation Inventory"
    description: "Nodes with Docker installed (includes thousand_eyes child group)"
    parents:
      - by_function
    children:
      - thousand_eyes

  - name: general
    inventory: "Network Automation Inventory"
    description: "General purpose hosts"
    parents:
      - by_function

  - name: splunk
    inventory: "Network Automation Inventory"
    description: "All Splunk infrastructure nodes"
    parents:
      - by_function

  - name: splunk_indexers
    inventory: "Network Automation Inventory"
    description: "Splunk indexer nodes"
    parents:
      - splunk

  - name: splunk_search_heads
    inventory: "Network Automation Inventory"
    description: "Splunk search head nodes"
    parents:
      - splunk

  - name: splunk_forwarders
    inventory: "Network Automation Inventory"
    description: "Splunk forwarder (syslog) nodes"
    parents:
      - splunk

  - name: splunk_heavy_forwarders
    inventory: "Network Automation Inventory"
    description: "Splunk heavy forwarder / stream nodes"
    parents:
      - splunk

  - name: splunk_masters
    inventory: "Network Automation Inventory"
    description: "Splunk cluster master nodes"
    parents:
      - splunk

  - name: zoomprov
    inventory: "Network Automation Inventory"
    description: "Zoom provisioning nodes"
    parents:
      - by_function

  # ── by_region ──────────────────────────────────────────────────────────────
  - name: by_region
    inventory: "Network Automation Inventory"
    description: "Hosts grouped by geographic region"

  - name: US
    inventory: "Network Automation Inventory"
    description: "United States region"
    parents:
      - by_region

  - name: US1
    inventory: "Network Automation Inventory"
    description: "US Region 1 (primary US DC)"
    parents:
      - US

  - name: US1_DMZ10
    inventory: "Network Automation Inventory"
    description: "US Region 1 DMZ segment 10"
    parents:
      - US

  - name: US2
    inventory: "Network Automation Inventory"
    description: "US Region 2"
    parents:
      - US

  - name: US3
    inventory: "Network Automation Inventory"
    description: "US Region 3"
    parents:
      - US

  - name: EMEA
    inventory: "Network Automation Inventory"
    description: "Europe, Middle East & Africa region"
    parents:
      - by_region

  - name: EU1
    inventory: "Network Automation Inventory"
    description: "EMEA Region 1"
    parents:
      - EMEA

  - name: EU2
    inventory: "Network Automation Inventory"
    description: "EMEA Region 2"
    parents:
      - EMEA

  - name: APAC
    inventory: "Network Automation Inventory"
    description: "Asia-Pacific region"
    parents:
      - by_region

  - name: AS1
    inventory: "Network Automation Inventory"
    description: "APAC Region 1"
    parents:
      - APAC

  - name: AS2
    inventory: "Network Automation Inventory"
    description: "APAC Region 2"
    parents:
      - APAC

  # ── py3_hosts ──────────────────────────────────────────────────────────────
  - name: py3_hosts
    inventory: "Network Automation Inventory"
    description: "Hosts using Python 3 interpreter"
    variables:
      ansible_python_interpreter: /usr/bin/python3

# ---------------------------------------------------------------------------
# HOSTS
# Each unique hostname from the source inventory, with variables where set.
# Group membership is driven by controller_groups above; hosts just need to
# exist in the inventory — AAP resolves group membership via the groups' own
# host lists or via the hosts' `groups` key depending on module version.
# Using the `groups` key here for explicit, readable membership.
# ---------------------------------------------------------------------------
controller_hosts:

  # ── iPerf nodes ────────────────────────────────────────────────────────────
  - name: as1iperf01
    inventory: "Network Automation Inventory"
    groups:
      - iperf
      - AS1
      - py3_hosts

  - name: as2iperf01
    inventory: "Network Automation Inventory"
    groups:
      - iperf
      - AS2
      - py3_hosts

  - name: us2iperf01
    inventory: "Network Automation Inventory"
    groups:
      - iperf
      - US2
      - py3_hosts

  - name: eu1iperf01
    inventory: "Network Automation Inventory"
    groups:
      - iperf
      - EU1
      - py3_hosts

  - name: eu2iperf01
    inventory: "Network Automation Inventory"
    groups:
      - iperf
      - EU2
      - py3_hosts

  # ── ThousandEyes nodes ─────────────────────────────────────────────────────
  - name: eu1tea01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - EU1
      - py3_hosts

  - name: eu2tea01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - EU2
      - py3_hosts

  - name: as1tea01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - AS1
      - py3_hosts

  - name: as2tea01
    inventory: "Network Automation Inventory"
    variables:
      ansible_host: "10.205.29.20"   # explicit ansible_host set in source inventory
    groups:
      - thousand_eyes
      - AS2
      - py3_hosts

  - name: us1tea01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - US1
      - py3_hosts

  - name: us2tea01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - US2
      - py3_hosts

  - name: us3tea01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - US3
      - py3_hosts

  - name: us2avstestvm01
    inventory: "Network Automation Inventory"
    groups:
      - thousand_eyes
      - py3_hosts

  # ── EVE-NG ─────────────────────────────────────────────────────────────────
  - name: us1deveveng01
    inventory: "Network Automation Inventory"
    groups:
      - eveng
      - US1

  # ── Tower / AAP ────────────────────────────────────────────────────────────
  - name: us1atower02
    inventory: "Network Automation Inventory"
    groups:
      - tower
      - US1
      - py3_hosts

  # ── GitLab ─────────────────────────────────────────────────────────────────
  - name: us1gitlab01
    inventory: "Network Automation Inventory"
    groups:
      - gitlab
      - US1
      - py3_hosts

  # ── Chronicle / Docker ─────────────────────────────────────────────────────
  # us1gc01 appears in both `chronicle` and `docker` in the source inventory
  - name: us1gc01
    inventory: "Network Automation Inventory"
    groups:
      - chronicle
      - docker
      - US1
      - py3_hosts

  # ── General hosts ──────────────────────────────────────────────────────────
  - name: us1netweb01
    inventory: "Network Automation Inventory"
    groups:
      - general
      - US1
      - py3_hosts

  - name: us1webnotification01
    inventory: "Network Automation Inventory"
    groups:
      - general
      - US1_DMZ10

  - name: us3extgwc01
    inventory: "Network Automation Inventory"
    groups:
      - general
      - US3
      - py3_hosts

  # ── Splunk stack ───────────────────────────────────────────────────────────
  - name: us1sesidx01
    inventory: "Network Automation Inventory"
    groups:
      - splunk_indexers
      - US1

  - name: us1sesidx02
    inventory: "Network Automation Inventory"
    groups:
      - splunk_indexers
      - US1

  - name: us1sesidx03
    inventory: "Network Automation Inventory"
    groups:
      - splunk_indexers
      - US1

  - name: us1sessearch01
    inventory: "Network Automation Inventory"
    groups:
      - splunk_search_heads
      - US1

  - name: us1syslog02
    inventory: "Network Automation Inventory"
    groups:
      - splunk_forwarders
      - US1

  - name: us1sesstream01
    inventory: "Network Automation Inventory"
    groups:
      - splunk_heavy_forwarders
      - US1

  - name: us1sesmaster01
    inventory: "Network Automation Inventory"
    groups:
      - splunk_masters
      - US1

  # ── Zoom provisioning ──────────────────────────────────────────────────────
  - name: us1zoomprov01
    inventory: "Network Automation Inventory"
    groups:
      - zoomprov
      - US1

  - name: us3zoomprov01
    inventory: "Network Automation Inventory"
    groups:
      - zoomprov
      - US3