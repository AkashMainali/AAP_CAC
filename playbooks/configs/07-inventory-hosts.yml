    # Dual-role: member of both ch_distro and ch_av

  # ── DC distro ──────────────────────────────────────────────────────────────
  - name: staging-DC-ACC1E-01
    inventory: "Network Switches Inventory"

  - name: staging-DC-ACC3E-01
    inventory: "Network Switches Inventory"

  - name: staging-DC-ACC3E-02
    inventory: "Network Switches Inventory"

  - name: staging-DC-ACC6E-01
    inventory: "Network Switches Inventory"

  - name: staging-DC-ACC6E-02
    inventory: "Network Switches Inventory"

  - name: staging-DC-ACC6W-01
    inventory: "Network Switches Inventory"

  - name: staging-DC-ACC8E-01
