---
controller_projects:
  - name: "AAP CaC - NetOps"
    organization: "Default"
    description: "Ansible Automation Platform Configuration-as-Code repository — NetOps team"
    scm_type: git
    scm_url: "https://github.com/AkashMainali/AAP_CAC.git"
    scm_branch: "main"
    # No credential needed — AkashMainali/AAP_CAC is a public GitHub repository
    scm_clean: true
    scm_delete_on_update: false
    scm_track_submodules: false
    scm_update_on_launch: false
    allow_override: false

controller_inventories:
  - name: "NetOps Linux Hosts"
    organization: "Default"



controller_inventory_sources:
  - name: "Proving Ground Inventory Source"
    inventory: "Proving Ground Inventory"
    description: >-
      Syncs hosts and groups from netops-production-hosts.yml in the AAP CaC repo.
      Covers IOS core/distro switches, IOS routers (WAN/CPE/cEdge),
      and NX-OS Nexus core switches with HSRP role host vars.
    source: scm
    source_project: "AAP CaC - NetOps"
    source_path: "playbooks/anp_inventory/netops-production-hosts.yml"
    #                                     ^^^^^^^^^^^
    #   Intentional double-g typo — matches the actual filename in Git exactly.
    #   If this is ever corrected in the repo, update this path to match.
    # Sync behaviour
    update_on_launch: true
    update_cache_timeout: 0
    # Overwrite controls
    overwrite: true
    overwrite_vars: true
    verbosity: 1